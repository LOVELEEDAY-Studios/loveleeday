<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVELEEDAY Photo Library</title><style>
:root{--ground:#FBF8F2;--ink:#16243A;--mid:#45536A;--dim:#616D7C;--line:#E6E0D6;--teal:#0A6261;--copper:#9B5C3E}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
header{padding:48px 40px 24px;border-bottom:1px solid var(--line)}h1{font:500 40px/1.1 Georgia,serif;margin:0}
header p{color:var(--mid);margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;padding:32px 40px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.im{position:relative;aspect-ratio:4/3;background:#eee}.im img{width:100%;height:100%;object-fit:cover;display:block}
.im b{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
figcaption{padding:12px 16px 16px;display:grid;gap:2px}figcaption span{color:var(--dim);font-size:12px}
em{font-style:normal;font-size:11px;font-weight:600;color:var(--copper);margin-right:6px}
ul{margin:6px 0 0;padding:0;list-style:none;font-size:11px;color:var(--mid)}
@media (max-width:600px){.grid,header{padding-left:16px;padding-right:16px}}
</style><style id="vcss">.flt{display:flex;flex-wrap:wrap;gap:8px;padding:16px 40px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ground);z-index:2}
.flt button{font:600 13px/1 ui-sans-serif,system-ui;border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.flt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vd{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.vd p{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--mid)}.vd .vr{color:var(--dim)}
.vb{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;margin-right:8px}
.vs{font-size:12px;color:var(--dim)}.v-keep{background:#E8F2F1;color:#0A6261}.v-keep-limited{background:#EEF0E6;color:#4F5B2A}
.v-replace{background:#F6EDE7;color:#9B5C3E}.v-cut{background:#F7E4E0;color:#A3321E}
figure[data-v="cut"] .im img{filter:grayscale(.6);opacity:.75}
figure[data-v="cut"]{border-color:#E9B9AE}figure[data-v="keep"]{border-color:#9FCBC7}</style></head><body><header><h1>Photo library</h1><p>82 photos from public/site/assets, public/site/assets/cards, brand/assets. Edge is a sharpness estimate (higher is crisper). Flags: under 1600 px, soft, unused.</p></header>
<nav class="flt"><button data-f="all" class="on">All 82</button><button data-f="keep">Keep 17</button><button data-f="keep-limited">Keep Limited 37</button><button data-f="replace">Replace 16</button><button data-f="cut">Cut 12</button></nav><main class="grid"><figure id="p1" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/architecture.jpg" alt=""><b>1</b></div><figcaption><strong>architecture.jpg</strong><span>public/site/assets</span><span>940 x 627 · 118 KB · edge 1865.2</span><em>under 1600 px</em><ul><li>brand/book-v2.html</li><li>brand/book.html</li><li>public/site/architecture.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 7/10</span><p>Warm timber and stone, strong diagonal, natural skylight, no people, no hands. Palette-adjacent (copper wood). Soft at 940 so band-only if re-sourced larger; works as texture crop.</p><p class="vr">Role: texture / band (after re-source)</p></div></figcaption></figure><figure id="p2" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/arthur.jpg" alt=""><b>2</b></div><figcaption><strong>arthur.jpg</strong><span>public/site/assets</span><span>940 x 627 · 83 KB · edge 2008.4</span><em>under 1600 px</em><ul><li>public/site/arthur.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 6/10</span><p>Moody profile through a mosaic window, honest and editorial, but low-key and face half lost; too dark for calm-warm, no readable subject. Fine as a small inset.</p><p class="vr">Role: texture</p></div></figcaption></figure><figure id="p3" data-v="cut"><div class="im"><img loading="lazy" src="../public/site/assets/contact-desk.jpg" alt=""><b>3</b></div><figcaption><strong>contact-desk.jpg</strong><span>public/site/assets</span><span>1500 x 999 · 142 KB · edge 210.1</span><em>under 1600 px</em><ul><li>public/site/contact.html</li></ul><div class="vd"><span class="vb v-cut">Cut</span><span class="vs">Design · 3/10</span><p>Sharp edge score 210, dated white phone and stylus, tablet is a dead black slab. Flat generic stock, no human, off-brand.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p4" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/contact-hero.jpg" alt=""><b>4</b></div><figcaption><strong>contact-hero.jpg</strong><span>public/site/assets</span><span>1500 x 845 · 233 KB · edge 1246.0</span><em>under 1600 px</em><ul><li>public/site/contact.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 6/10</span><p>Natural window light, real conversation, green exterior. But busy foreground clutter, world-map laptop sticker, man&#x27;s gesturing hand is mid-motion; hero-grade resolution missing. Fine at 4:5? Fails (two subjects spread wide).</p><p class="vr">Role: band (16:9 only)</p></div></figcaption></figure><figure id="p5" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/customer-data.jpg" alt=""><b>5</b></div><figcaption><strong>customer-data.jpg</strong><span>public/site/assets</span><span>940 x 627 · 83 KB · edge 964.7</span><em>under 1600 px</em><ul><li>public/site/customer-data.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 7/10</span><p>Documentary, warm, genuine laughter, authentic hands on cups. Strong portrait quality but 940 px and no link to &quot;customer data&quot; beyond people talking. Reads real.</p><p class="vr">Role: portrait / band after re-source</p></div></figcaption></figure><figure id="p6" data-v="cut"><div class="im"><img loading="lazy" src="../public/site/assets/dinner.jpg" alt=""><b>6</b></div><figcaption><strong>dinner.jpg</strong><span>public/site/assets</span><span>940 x 529 · 73 KB · edge 1227.7</span><em>under 1600 px</em><ul><li>brand/book-v2.html</li><li>brand/book.html</li><li>public/site/index.html</li></ul><div class="vd"><span class="vb v-cut">Cut</span><span class="vs">Design · 3/10</span><p>Fire-lit dark scene, subject silhouetted, kinetic grill in foreground, orange-brown crush. Too dark and dramatic for a calm site; reads as a different brand (nightlife), cropped awkwardly in 16:9.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p7" data-v="cut"><div class="im"><img loading="lazy" src="../public/site/assets/hero-team-desktop.jpg" alt=""><b>7</b></div><figcaption><strong>hero-team-desktop.jpg</strong><span>public/site/assets</span><span>2000 x 1481 · 268 KB · edge 1315.5</span><ul><li>brand/book-v2.html</li><li>public/site/assets/fix/hero.css</li></ul><div class="vd"><span class="vb v-cut">Cut</span><span class="vs">Design · 3/10</span><p>Owner verdict. Why weak: the classic &quot;two colleagues look at a report&quot; stock pose, both staring at a sheet nobody can read, so no real moment; a laptop with its back to us; wardrobe styled (tied sweater, blazer); blank white backdrop that could be any company in any industry; casting-formula pair. Under 2400 px anyway.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p8" data-v="cut"><div class="im"><img loading="lazy" src="../public/site/assets/hero-team-phone.jpg" alt=""><b>8</b></div><figcaption><strong>hero-team-phone.jpg</strong><span>public/site/assets</span><span>1000 x 750 · 97 KB · edge 1653.2</span><em>under 1600 px</em><ul><li>public/site/assets/fix/hero.css</li></ul><div class="vd"><span class="vb v-cut">Cut</span><span class="vs">Design · 3/10</span><p>Owner verdict. Same frame cropped tighter, so the stock pose and costume wardrobe get louder; cropped faces.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p9" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/hero.jpg" alt=""><b>9</b></div><figcaption><strong>hero.jpg</strong><span>public/site/assets</span><span>940 x 627 · 120 KB · edge 3948.3</span><em>under 1600 px</em><ul><li>brand/book-v2.html</li><li>brand/book.html</li><li>public/site/assets/chrome.css</li><li>public/site/contact.html</li><li>public/site/talk.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 7/10</span><p>Timber-and-glass atrium, warm wood, civic/university space, real depth, small distant people. Palette-compatible (wood to copper). Sharp edges 3948 suggests slightly crunchy; do not sharpen. Only 940 px.</p><p class="vr">Role: band after re-source</p></div></figcaption></figure><figure id="p10" data-v="cut"><div class="im"><img loading="lazy" src="../public/site/assets/industries.jpg" alt=""><b>10</b></div><figcaption><strong>industries.jpg</strong><span>public/site/assets</span><span>940 x 627 · 66 KB · edge 625.8</span><em>under 1600 px</em><ul><li>public/site/industries.html</li></ul><div class="vd"><span class="vb v-cut">Cut</span><span class="vs">Design · 4/10</span><p>Posed waiter with tray in yellow-cast restaurant, nostalgic styling, tray and drink held for camera (staged stock tell), yellow cast fights cream.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p11" data-v="replace"><div class="im"><img loading="lazy" src="../public/site/assets/industry-government-2.jpg" alt=""><b>11</b></div><figcaption><strong>industry-government-2.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 266 KB · edge 2161.8</span><em>unused</em><ul><li>not used anywhere</li></ul><div class="vd"><span class="vb v-replace">Replace</span><span class="vs">Design · 4/10</span><p>Bright but a European (Luxembourg-style) town hall with foreign flags, saturated blue sky, deep contrast. Not US government, sky too blue vs navy. Well framed.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p12" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/industry-government.jpg" alt=""><b>12</b></div><figcaption><strong>industry-government.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 549 KB · edge 4148.1</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 6/10</span><p>Gorgeous council chamber but heavy gold/brown saturation and ornate ceiling shout &quot;heritage grandeur&quot;, not calm modern operator. Dark. Can do as a government band with a muted grade.</p><p class="vr">Role: band (government)</p></div></figcaption></figure><figure id="p13" data-v="keep"><div class="im"><img loading="lazy" src="../public/site/assets/industry-hospitality-2.jpg" alt=""><b>13</b></div><figcaption><strong>industry-hospitality-2.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 280 KB · edge 1392.2</span><em>unused</em><ul><li>not used anywhere</li></ul><div class="vd"><span class="vb v-keep">Keep</span><span class="vs">Design · 7/10</span><p>Two chefs in work apron, natural gesture, hands on task (not posed), cool teal tone sits near brand teal. Crop safe 16:9. Slightly dark.</p><p class="vr">Role: industry card (hospitality)</p></div></figcaption></figure><figure id="p14" data-v="keep"><div class="im"><img loading="lazy" src="../public/site/assets/industry-hospitality.jpg" alt=""><b>14</b></div><figcaption><strong>industry-hospitality.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 388 KB · edge 2328.7</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li></ul><div class="vd"><span class="vb v-keep">Keep</span><span class="vs">Design · 7/10</span><p>Empty restaurant at golden hour, warm light, calm, no hands/faces, copper tones match. Wood and brass compliments copper.</p><p class="vr">Role: industry card / band</p></div></figcaption></figure><figure id="p15" data-v="replace"><div class="im"><img loading="lazy" src="../public/site/assets/industry-manufacturing-2.jpg" alt=""><b>15</b></div><figcaption><strong>industry-manufacturing-2.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 259 KB · edge 1955.0</span><em>unused</em><ul><li>not used anywhere</li></ul><div class="vd"><span class="vb v-replace">Replace</span><span class="vs">Design · 3/10</span><p>Cluttered Chinese-signed CNC floor, greenish cast, red/blue bins, fan; says &quot;overseas contract factory&quot;, not American operator.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p16" data-v="keep"><div class="im"><img loading="lazy" src="../public/site/assets/industry-manufacturing-3.jpg" alt=""><b>16</b></div><figcaption><strong>industry-manufacturing-3.jpg</strong><span>public/site/assets</span><span>1880 x 1251 · 258 KB · edge 1521.0</span><ul><li>public/site/operational-intelligence.html</li></ul><div class="vd"><span class="vb v-keep">Keep</span><span class="vs">Design · 7/10</span><p>Two real workers talking over a clipboard, natural faces, hands fine (clipboard), strong operational-data narrative. Neon vest and saturated blue shelving need grade down.</p><p class="vr">Role: industry card / portrait</p></div></figcaption></figure><figure id="p17" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/industry-manufacturing.jpg" alt=""><b>17</b></div><figcaption><strong>industry-manufacturing.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 272 KB · edge 1055.4</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li><li>public/site/industries/manufacturing.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 6/10</span><p>Atmospheric shelving aisle, man scanning a bin. Dark, face turned away, orange/rust racking is within copper range. Good texture; weak for a hero.</p><p class="vr">Role: industry card (manufacturing)</p></div></figcaption></figure><figure id="p18" data-v="keep"><div class="im"><img loading="lazy" src="../public/site/assets/industry-nonprofit-2.jpg" alt=""><b>18</b></div><figcaption><strong>industry-nonprofit-2.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 274 KB · edge 1510.6</span><em>unused</em><ul><li>not used anywhere</li></ul><div class="vd"><span class="vb v-keep">Keep</span><span class="vs">Design · 8/10</span><p>Bright window light, brick wall, real volunteers sorting donations, natural hands on clothing, plants. Warm, calm, genuinely real. Matches palette.</p><p class="vr">Role: industry card / band (nonprofit)</p></div></figcaption></figure><figure id="p19" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/industry-nonprofit.jpg" alt=""><b>19</b></div><figcaption><strong>industry-nonprofit.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 214 KB · edge 915.5</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 6/10</span><p>Package hand-off with van, branded &quot;VOLUNTEER&quot; tee, tattooed arms; hand-off hands good. Washed pink-cream cast, bit staged.</p><p class="vr">Role: industry card</p></div></figcaption></figure><figure id="p20" data-v="replace"><div class="im"><img loading="lazy" src="../public/site/assets/industry-portfolios-2.jpg" alt=""><b>20</b></div><figcaption><strong>industry-portfolios-2.jpg</strong><span>public/site/assets</span><span>1880 x 1254 · 274 KB · edge 1971.6</span><em>unused</em><ul><li>not used anywhere</li></ul><div class="vd"><span class="vb v-replace">Replace</span><span class="vs">Design · 4/10</span><p>Grey 1970s tower under saturated blue sky with palm trees: foreign (Huawei-region) or Sun Belt generic, harsh. Sharp 4518 means crunchy over-processed.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p21" data-v="cut"><div class="im"><img loading="lazy" src="../public/site/assets/industry-portfolios.jpg" alt=""><b>21</b></div><figcaption><strong>industry-portfolios.jpg</strong><span>public/site/assets</span><span>1880 x 1056 · 145 KB · edge 649.7</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li></ul><div class="vd"><span class="vb v-cut">Cut</span><span class="vs">Design · 3/10</span><p>Sunrise skyline with a HUAWEI sign visible on a rooftop; cliche orange gradient; wide letterbox crop; a competitor brand tell.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p22" data-v="keep"><div class="im"><img loading="lazy" src="../public/site/assets/industry-professional-services-2.jpg" alt=""><b>22</b></div><figcaption><strong>industry-professional-services-2.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 244 KB · edge 1590.1</span><em>unused</em><ul><li>not used anywhere</li></ul><div class="vd"><span class="vb v-keep">Keep</span><span class="vs">Design · 7/10</span><p>Bright high-rise meeting room, two people at a folder, cool daylight, plants. Slightly stock-staged but honest and light; cold cast needs warming.</p><p class="vr">Role: industry card / band</p></div></figcaption></figure><figure id="p23" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/industry-professional-services-3.jpg" alt=""><b>23</b></div><figcaption><strong>industry-professional-services-3.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 258 KB · edge 1486.6</span><ul><li>public/site/customer-data.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 6/10</span><p>Same room as 22, different framing: duplicate-of-shoot. Fine alone, but 22 and 23 together read as one repeated scene.</p><p class="vr">Role: industry card (alternate)</p></div></figcaption></figure><figure id="p24" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/industry-professional-services.jpg" alt=""><b>24</b></div><figcaption><strong>industry-professional-services.jpg</strong><span>public/site/assets</span><span>1880 x 1251 · 202 KB · edge 450.1</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 6/10</span><p>Close over-the-shoulder with loan document, orange table, warm, human; hands on paper OK but the foreground head is cut and out of focus (edge score 450). Orange wood is hot against cream.</p><p class="vr">Role: portrait / card</p></div></figcaption></figure><figure id="p25" data-v="replace"><div class="im"><img loading="lazy" src="../public/site/assets/industry-property-2.jpg" alt=""><b>25</b></div><figcaption><strong>industry-property-2.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 292 KB · edge 4518.8</span><em>unused</em><ul><li>not used anywhere</li></ul><div class="vd"><span class="vb v-replace">Replace</span><span class="vs">Design · 3/10</span><p>Cairo-style apartments, window ACs, palm trees; wrong country, hard sun, sharp 4518 crunch.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p26" data-v="replace"><div class="im"><img loading="lazy" src="../public/site/assets/industry-property.jpg" alt=""><b>26</b></div><figcaption><strong>industry-property.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 356 KB · edge 3055.3</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li><li>public/site/industries/property.html</li></ul><div class="vd"><span class="vb v-replace">Replace</span><span class="vs">Design · 4/10</span><p>Dusk street, parked cars cut at frame edge, pedestrian-crossing sign (Quebec), dark foreground; gloomy. Colour in the buildings is fine.</p><p class="vr">Role: none</p></div></figcaption></figure><figure id="p27" data-v="keep"><div class="im"><img loading="lazy" src="../public/site/assets/industry-retail-2.jpg" alt=""><b>27</b></div><figcaption><strong>industry-retail-2.jpg</strong><span>public/site/assets</span><span>1880 x 1255 · 271 KB · edge 2316.1</span><em>unused</em><ul><li>not used anywhere</li></ul><div class="vd"><span class="vb v-keep">Keep</span><span class="vs">Design · 8/10</span><p>Bright boutique, woman choosing from a rail, plants, soft light, no staging stare, palette-friendly cream. Back to camera avoids face issues.</p><p class="vr">Role: industry card / band (retail)</p></div></figcaption></figure><figure id="p28" data-v="keep"><div class="im"><img loading="lazy" src="../public/site/assets/industry-retail-3.jpg" alt=""><b>28</b></div><figcaption><strong>industry-retail-3.jpg</strong><span>public/site/assets</span><span>1880 x 1255 · 260 KB · edge 1818.7</span><ul><li>public/site/customer-data.html</li></ul><div class="vd"><span class="vb v-keep">Keep</span><span class="vs">Design · 7/10</span><p>Older shop owner at jewelry counter, authentic, daylight, clean white. Slightly high-key, cropped counter.</p><p class="vr">Role: portrait / industry card</p></div></figcaption></figure><figure id="p29" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/industry-retail.jpg" alt=""><b>29</b></div><figcaption><strong>industry-retail.jpg</strong><span>public/site/assets</span><span>1880 x 1255 · 227 KB · edge 1062.8</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="vs">Design · 6/10</span><p>Two shopkeepers in aprons, genuine, but crate carried toward camera looks staged, cluttered shelf and blurred green foreground.</p><p class="vr">Role: industry card (alt)</p></div></figcaption></figure><figure id="p30" data-v="keep-limited"><div class="im"><img loading="lazy" src="../public/site/assets/industry-schools.jpg" alt=""><b>30</b></div><figcaption><strong>industry-schools.jpg</strong><span>public/site/assets</span><span>1880 x 1253 · 223 KB · edge 2129.3</span><ul><li>brand/book-v2.html</li><li>brand/book.html</li><li>public/site/industries/schools.html</li></ul><div class="vd"><span class="vb v-keep-limited">Keep Limited</span><span class="
