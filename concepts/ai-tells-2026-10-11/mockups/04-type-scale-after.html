<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mockup</title><style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap');
:root{--ink:#0f2233;--ink2:#3d5063;--paper:#f6f1e7;--paper2:#ece4d3;--teal:#0e6a6a;--teal2:#0a4f50;--line:#d9cfba;--night:#0c1a28;--night2:#8fa6b8;
--head:'Newsreader',Georgia,serif;--body:'Public Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
.wrap{width:min(1120px,calc(100% - 96px));margin-inline:auto}
.night{background:var(--night);color:#f6f1e7}
h1,h2,h3{font-family:var(--head);font-weight:500;letter-spacing:-.012em;line-height:1.1;margin:0}
h1{font-size:64px}h2{font-size:40px}h3{font-size:28px}
p{margin:0;max-width:62ch;color:var(--ink2)}.night p{color:#c5d2dc}
.lead{font-size:20px;line-height:1.55}
.kicker{font-size:14px;font-weight:600;color:var(--teal);margin:0 0 12px}.night .kicker{color:#7fd0c9}
.btn{background:var(--teal);color:#fff;border-radius:6px;padding:0 22px;height:48px;display:inline-flex;align-items:center;font-size:16px;font-weight:600;text-decoration:none}
.night .btn{background:#f6f1e7;color:var(--ink)}
.tl{color:var(--teal2);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}.night .tl{color:#f6f1e7}
@media(max-width:760px){.wrap{width:calc(100% - 40px)}h1{font-size:40px}h2{font-size:32px}h3{font-size:24px}.lead{font-size:18px}}
</style></head><body><div id="stage"><section style="padding:80px 0"><div class="wrap"><p class="kicker">Proposed scale: five steps, two weights</p><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #d9cfba;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">64px</span><span style="font:500 64px/1.1 'Newsreader',Georgia,serif;letter-spacing:-.012em">Know what happened</span></div><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #d9cfba;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">40px</span><span style="font:500 40px/1.1 'Newsreader',Georgia,serif;letter-spacing:-.012em">Know what happened</span></div><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #d9cfba;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">28px</span><span style="font:500 28px/1.1 'Newsreader',Georgia,serif;letter-spacing:-.012em">Know what happened</span></div><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #d9cfba;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">20px</span><span style="font:500 20px/1.1 'Newsreader',Georgia,serif;letter-spacing:-.012em">Know what happened</span></div><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #d9cfba;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">17px</span><span style="font:500 17px/1.1 'Newsreader',Georgia,serif;letter-spacing:-.012em">Know what happened</span></div><p style="font-size:14px;margin-top:20px">Headlines Newsreader 500, text Public Sans 400 and 600. Every page picks from these five.</p></div></section></div></body></html>
