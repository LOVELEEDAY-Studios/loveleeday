<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mockup</title><style>
@import url('../fonts.css');
:root{--ink:#0B1F3A;--ink2:#3B4D63;--paper:#f6f1e7;--paper2:#EDE5D4;--teal:#0A6F68;--teal2:#08524D;--line:#DDD3BF;--night:#0B1F3A;--night2:#A9B6C8;
--head:'Sentient',Georgia,serif;--body:'Switzer',sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
.wrap{width:min(1120px,calc(100% - 96px));margin-inline:auto}
.night{background:var(--night);color:#f6f1e7}
h1,h2,h3{font-family:var(--body);font-weight:600;letter-spacing:-.028em;line-height:1.08;margin:0}
h1{font-size:64px}h2{font-size:40px}h3{font-size:28px}
p{margin:0;max-width:62ch;color:var(--ink2)}.night p{color:#C9D4E3}
.lead{font-size:20px;line-height:1.55}
.kicker{font-size:14px;font-weight:600;color:var(--teal);margin:0 0 12px}.night .kicker{color:#22D3C5}
.btn{background:var(--teal);color:#fff;border-radius:6px;padding:0 22px;height:48px;display:inline-flex;align-items:center;font-size:16px;font-weight:600;text-decoration:none}
.night .btn{background:#22D3C5;color:var(--ink)}
.tl{color:var(--teal2);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}.night .tl{color:#f6f1e7}
@media(max-width:760px){.wrap{width:calc(100% - 40px)}h1{font-size:40px}h2{font-size:32px}h3{font-size:24px}.lead{font-size:18px}}
</style></head><body><div id="stage"><section style="padding:80px 0"><div class="wrap"><p class="kicker">Proposed scale: five steps, two weights</p><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #DDD3BF;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">64px</span><span style="font:600 64px/1.1 'Switzer',sans-serif;letter-spacing:-.028em">Know what happened</span></div><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #DDD3BF;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">40px</span><span style="font:600 40px/1.1 'Switzer',sans-serif;letter-spacing:-.028em">Know what happened</span></div><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #DDD3BF;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">28px</span><span style="font:600 28px/1.1 'Switzer',sans-serif;letter-spacing:-.028em">Know what happened</span></div><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #DDD3BF;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">20px</span><span style="font:600 20px/1.1 'Switzer',sans-serif;letter-spacing:-.028em">Know what happened</span></div><div style="display:flex;align-items:baseline;gap:18px;border-bottom:1px solid #DDD3BF;padding:6px 0"><span style="width:56px;font:12px monospace;color:#888">17px</span><span style="font:600 17px/1.1 'Switzer',sans-serif;letter-spacing:-.028em">Know what happened</span></div><p style="font-size:14px;margin-top:20px">Headlines Switzer 600, text Switzer 400 and 500, answers in Sentient 400. Every page picks from these five.</p></div></section></div></body></html>
