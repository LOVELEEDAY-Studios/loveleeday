<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mockup</title><style>
@import url('../fonts.css');
:root{--ink:#0B1F3A;--ink2:#3B4D63;--paper:#f6f1e7;--paper2:#EDE5D4;--teal:#0A6F68;--teal2:#08524D;--line:#DDD3BF;--night:#0B1F3A;--night2:#A9B6C8;
--head:'Sentient',Georgia,serif;--body:'Switzer',sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
.wrap{width:min(1120px,calc(100% - 96px));margin-inline:auto}
.night{background:var(--night);color:#f6f1e7}
h1,h2,h3{font-family:var(--body);font-weight:600;letter-spacing:-.028em;line-height:1.08;margin:0}
h1{font-size:64px}h2{font-size:40px}h3{font-size:28px}
p{margin:0;max-width:62ch;color:var(--ink2)}.night p{color:#C9D4E3}
.lead{font-size:20px;line-height:1.55}
.kicker{font-size:14px;font-weight:600;color:var(--teal);margin:0 0 12px}.night .kicker{color:#22D3C5}
.btn{background:var(--teal);color:#fff;border-radius:6px;padding:0 22px;height:48px;display:inline-flex;align-items:center;font-size:16px;font-weight:600;text-decoration:none}
.night .btn{background:#22D3C5;color:var(--ink)}
.tl{color:var(--teal2);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}.night .tl{color:#f6f1e7}
@media(max-width:760px){.wrap{width:calc(100% - 40px)}h1{font-size:40px}h2{font-size:32px}h3{font-size:24px}.lead{font-size:18px}}
</style></head><body><div id="stage"><section class="night" style="padding:72px 0"><div class="wrap"><div style="max-width:880px;margin:auto"><svg class="d9" viewBox="0 0 880 300" style="width:100%;height:auto" role="img" aria-label="Three names resolve to one company">
<g font-family="Switzer, sans-serif" font-size="15" fill="#f6f1e7">
<g stroke="#22D3C5" stroke-width="1.5" fill="none"><path d="M280 60 C 400 60, 440 150, 520 150"/><path d="M280 150 L 520 150"/><path d="M280 240 C 400 240, 440 150, 520 150"/></g>
<g><rect x="30" y="38" width="250" height="44" rx="4" fill="none" stroke="#5A6B82"/><text x="48" y="66">Ledger: Vendor 44127</text>
<rect x="30" y="128" width="250" height="44" rx="4" fill="none" stroke="#5A6B82"/><text x="48" y="156">Mailbox: HES</text>
<rect x="30" y="218" width="250" height="44" rx="4" fill="none" stroke="#5A6B82"/><text x="48" y="246">Contract: Harbor Equipment</text></g>
<rect x="520" y="100" width="340" height="100" rx="4" fill="#f6f1e7"/><text x="540" y="140" fill="#0B1F3A" font-family="Sentient, serif" font-size="23" font-weight="500">Harbor Equipment Services</text><text x="540" y="174" fill="#3B4D63" font-size="15">One company, three names kept as aliases</text></g></svg>
<div class="m9" style="display:none"><div style="border:1px solid #5A6B82;padding:12px 14px;margin-bottom:8px">Ledger: Vendor 44127</div><div style="border:1px solid #5A6B82;padding:12px 14px;margin-bottom:8px">Mailbox: HES</div><div style="border:1px solid #5A6B82;padding:12px 14px;margin-bottom:14px">Contract: Harbor Equipment</div><div style="background:#F6F1E7;color:#0B1F3A;padding:16px 18px"><div style="font-family:var(--head);font-size:22px;font-weight:500">Harbor Equipment Services</div><div style="font-size:15px;color:#3B4D63">One company, three names kept as aliases</div></div></div>
<p style="text-align:center;font-size:14px;margin:12px auto 0;color:#A9B6C8">How three records resolve to one. Example data.</p></div></div></section><style>@media(max-width:760px){.d9{display:none}.m9{display:block!important}}</style></div></body></html>
